name: Build

on: [push, pull_request]

jobs:
  build-linux-i386:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Linux (32 bit)
      run: |
        scripts/build-ubuntu-i386.sh
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-linux-i386
        path: ./to-upload
        if-no-files-found: error

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Linux (64 Bit)
      run: |
        scripts/build-ubuntu-amd64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-linux-amd64
        path: ./to-upload
        if-no-files-found: error

  build-windows-win-i386:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Windows (32 bit)
      run: |
        git submodule init;git submodule update
        ./waf.bat configure -T release --prefix=./win --disable-warns --build-game=hl2sbpp
        ./waf.bat install
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-win-i386
        path: ./win
        if-no-files-found: error

  build-windows-win-amd64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Windows (64 bit)
      run: |
        git submodule init;git submodule update
        ./waf.bat configure -T release --prefix=./win --disable-warns --build-game=hl2sbpp -8
        ./waf.bat install
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-win-amd64
        path: ./win
        if-no-files-found: error

  build-dedicated-windows-i386:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Windows Dedicated (32 bit) 
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T debug -d --prefix=./win --build-game=hl2sbpp
        ./waf.bat install
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-win-dedicated-i386
        path: ./win
        if-no-files-found: error

  build-dedicated-windows-amd64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Windows Dedicated (64 bit)
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T debug -d -8 --prefix=./win --build-game=hl2sbpp
        ./waf.bat install
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-win-dedicated-amd64
        path: ./win
        if-no-files-found: error

  build-dedicated-linux-i386:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Linux Dedicated (32 bit)
      run: |
        scripts/build-ubuntu-i386.sh -d
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-linux-dedicated-i386
        path: ./to-upload
        if-no-files-found: error

  build-dedicated-linux-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Linux Dedicated (64 bit)
      run: |
        scripts/build-ubuntu-amd64.sh -d
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-linux-dedicated-amd64
        path: ./to-upload
        if-no-files-found: error

  build-macos-amd64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build MacOS (64 bit)
      run: |
        scripts/build-macos-amd64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-macos-amd64
        path: ./to-upload
        if-no-files-found: error

  build-dedicated-macos-amd64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build MacOS Dedicated (64 bit)
      run: |
        scripts/build-macos-amd64.sh -d
    - uses: actions/upload-artifact@v4
      with:
        name: hl2sbpp-macos-dedicated-amd64
        path: ./to-upload
        if-no-files-found: error
